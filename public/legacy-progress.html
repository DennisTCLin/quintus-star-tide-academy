<body><main><p>星潮學院 · 原始紀錄保護</p><h1>先收好你的舊版航程</h1>
<p>請在當時遊玩的裝置與瀏覽器開啟這一頁。這裡會保存本機的舊群島、英雄選擇與舊學習紀錄，不需要登入或加入新戰場。</p>
<p>匯出會保留每份原始內容，包括不同帳號與早期版本。它不會清除、合併或覆寫資料，也不會上傳到伺服器。雲端帳號紀錄仍留在原網站。</p>
<p id="status" role="status">正在尋找這個瀏覽器的舊紀錄…</p><button id="export" disabled>匯出完整舊版紀錄</button><p><a id="download" hidden>下載已準備的備份</a></p>
<details><summary>查看找到的存檔</summary><ul id="records"></ul></details>
<p>檔案含有這個瀏覽器的遊戲進度，請保存在自己的「檔案」中。搬入共享群島前，需要先檢查重複領地；下載完成不代表已搬移。</p><a href="/">返回星潮學院</a></main></body></html>
