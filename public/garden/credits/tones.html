    <h2>目前全站語音</h2>
    <p>網站目前所有可播放的題目、示範、回饋與操作指引，皆使用 <strong>Higgsfield Daisy</strong> 合成語音，並由站內 MP3 資產播放。執行中的網站不載入教育部錄音。</p>
    <h2>注音資料參考</h2>
    <p>題目文字、注音與聲調標記的校對參考中華民國教育部《國語辭典簡編本》與《國語注音符號手冊》。教育部未參與或背書本遊戲。</p>
