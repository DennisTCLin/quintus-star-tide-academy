<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星潮・原版造型驗收</title><style>body{margin:0;background:#092331;color:#eff8f5;font:17px system-ui}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:28px}p{color:#b9d6d6}input{box-sizing:border-box;width:100%;padding:15px;border-radius:12px;font:inherit;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}article{background:#153b4b;border:1px solid #386171;border-radius:14px;padding:10px;text-align:center}img{width:100%;aspect-ratio:1;object-fit:contain}b{display:block}small{color:#bad4df}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:20px 0}video{width:100%;border-radius:10px}section{margin-top:35px}</style><main><h1>回到熟悉的夥伴</h1><p>375 隻原版造型預覽。這個頁面只展示素材，不會修改玩家的等級、經驗或持有數。</p><input aria-label="搜尋角色" placeholder="找找喜歡的夥伴或怪物…"><div class="grid"></div><section><h2>原版三招動畫</h2><p>潮光獸、霧潮獺、泡沫貂：兩個小招與一個大招。</p><div class="videos"></div></section></main><script type="module">const data=await(await fetch('./preview-data.json')).json();const grid=document.querySelector('.grid');function render(q=''){grid.replaceChildren(...data.characters.filter(c=>c.name.includes(q)||c.id.includes(q)).map(c=>{const a=document.createElement('article');const im=document.createElement('img');im.src=c.thumbnail||c.image;im.alt=c.name;im.loading='lazy';const b=document.createElement('b');b.textContent=c.name;const s=document.createElement('small');s.textContent=c.rarity+'級';a.append(im,b,s);return a}));}render();document.querySelector('input').addEventListener('input',e=>render(e.target.value));document.querySelector('.videos').replaceChildren(...data.clips.map(c=>{const a=document.createElement('article');const v=document.createElement('video');v.src=c.src;v.poster=c.poster;v.controls=true;v.playsInline=true;v.preload='metadata';const b=document.createElement('b');b.textContent=c.name;a.append(v,b);return a}));</script></html>
